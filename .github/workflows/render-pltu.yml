name: PLTU Video Render

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  render-pltu-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -y -f

      - name: Bundle Remotion project
        run: |
          export PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
          export PUPPETEER_SKIP_DOWNLOAD=true
          npm run bundle

      - name: Verify bundle output
        run: |
          echo "=== Checking bundle directory ==="
          ls -la ./bundle/ 2>/dev/null || echo "bundle/ not found"
          ls -la ./build/ 2>/dev/null || echo "build/ not found"
          # Check for index.js in either location
          if [ -f ./bundle/index.js ]; then
            echo "Bundle index.js exists in ./bundle"
          elif [ -f ./build/index.js ]; then
            echo "Bundle index.js exists in ./build"
            # Create copy for render step
            cp -r ./build ./bundle
          else
            echo "ERROR: Bundle index.js not found!"
            exit 1
          fi

      - name: Render PLTU video
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm run render

      - name: Upload render output
        uses: actions/upload-artifact@v4
        with:
          name: pltu-final-mp4
          path: render/pltu-final.mp4
          retention-days: 30

      - name: Upload render logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pltu-render-log
          path: render/pltu-render.log
          retention-days: 30
