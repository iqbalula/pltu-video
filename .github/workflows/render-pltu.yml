name: PLTU Video Render

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  render-pltu-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Render PLTU video
        run: npm run render

      - name: Upload render output
        uses: actions/upload-artifact@v4
        with:
          name: pltu-final-mp4
          path: render/pltu-final.mp4
          retention-days: 30
