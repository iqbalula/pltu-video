name: PLTU Video Render

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  render-pltu-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          google-chrome-stable --version

      - name: Bundle
        run: npm run bundle
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Verify bundle output
        run: |
          echo "=== Checking build/ ==="
          ls -la build/
          echo "=== Checking build/public/ ==="
          ls -la build/public/
          echo "=== Copying build/ to bundle/ for render step ==="
          rm -rf bundle
          cp -r build bundle
          ls -la bundle/

      - name: Render PLTU video
        run: npm run render
        env:
          PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Upload render output
        uses: actions/upload-artifact@v4
        with:
          name: pltu-final-mp4
          path: render/pltu-final.mp4
          retention-days: 30